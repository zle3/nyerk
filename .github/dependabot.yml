# Weekly update pull requests. CI runs the tests, pip-audit and the image
# scan on each one; merge the green ones. Security fixes come as soon as
# GitHub learns of them, outside this schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-libraries:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Stay on Python 3.12; take its patch releases and Alpine refreshes.
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
