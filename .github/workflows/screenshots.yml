name: Screenshots

# Regenerates docs/images from a demo instance (tools/screenshots.py: fake
# members, fake IDs, fixed clock) and opens a pull request when they change.
# Nothing here talks to Discord or uses real server data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "nyerk/**"
      - "tools/**"
      - "requirements-screenshots.txt"

permissions:
  contents: read

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install fonts, Python packages and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-color-emoji
          pip install -r requirements-screenshots.txt
          python -m playwright install --with-deps chromium
      - run: python -m tools.screenshots docs/images
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: auto/screenshots
          add-paths: docs/images/*.png
          commit-message: "Screenshots: regenerate from the demo instance"
          title: "Screenshots: regenerate from the demo instance"
          body: |
            The README screenshots changed after the latest code on `main`.
            Generated by `python -m tools.screenshots` from demo data (fake members, fake IDs, fixed clock).

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          delete-branch: true
