name: Build image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Weekly rebuild, even without code changes, to pick up Alpine and Python
  # base image security fixes. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nyerk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Screenshot tool requirements still resolve (Playwright pins some of them)
        run: pip install --dry-run -r requirements-screenshots.txt
      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt --progress-spinner off

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nyerk:scan
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (the container starts, drops root and serves the web page)
        run: |
          mkdir -p smoke-data
          docker run -d --name smoke -p 18443:8443 -v "$PWD/smoke-data:/data" \
            -e NYERK_WEB_ONLY=1 -e ADMIN_PASSWORD=smoke-test-password nyerk:scan
          for i in $(seq 30); do curl -ksf -o /dev/null https://127.0.0.1:18443/login && break; sleep 1; done
          docker logs smoke
          curl -ksf -o /dev/null https://127.0.0.1:18443/login
          test "$(docker exec smoke sh -c 'cat /proc/1/status' | awk '/^Uid:/ {print $2}')" = 1000
          docker stop -t 30 smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0
          docker logs smoke 2>&1 | grep -q "Nyerk stopped."

      - name: Scan image (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nyerk:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Scan report for the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nyerk:scan
          scanners: vuln
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload scan report
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
            type=schedule,pattern=weekly-{{date 'YYYYMMDD'}}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
