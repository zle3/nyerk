# Local build from source (development). The server uses compose.yaml.
#   docker compose -f compose.build.yaml up -d --build
services:
  nyerk:
    build: .
    image: nyerk:latest
    # Rebuild on every deploy, so Dockge's Deploy/Update picks up new code
    # instead of reusing the first image it built.
    pull_policy: build
    container_name: nyerk
    restart: unless-stopped
    # Values come from the stack's .env (Dockge's env editor). Listing them
    # here instead of env_file works on every Compose version, with or
    # without a .env file.
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GUILD_ID: ${GUILD_ID:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NYERK_RESET_PASSWORD: ${NYERK_RESET_PASSWORD:-}
      WEB_TLS: ${WEB_TLS:-self-signed}
      WEB_PORT: ${WEB_PORT:-8443}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      NYERK_WEB_ONLY: ${NYERK_WEB_ONLY:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      PUBLIC_URL: ${PUBLIC_URL:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      OWNER_IDS: ${OWNER_IDS:-}
      ADMIN_ROLE_IDS: ${ADMIN_ROLE_IDS:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-lan}
      TUNNEL_PORT: ${TUNNEL_PORT:-8080}
    # Container lockdown: read-only filesystem except /data and /tmp, no extra
    # privileges. The startup script keeps only what it needs to hand /data to
    # PUID:PGID, then Nyerk runs as that user with no capabilities at all.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data          # SQLite DB, backups, logs, TLS cert
    ports:
      # Admin page on your LAN. Behind a Cloudflare Tunnel you can stop
      # publishing it: set WEB_BIND=127.0.0.1:8443 (this machine only).
      - "${WEB_BIND:-8443}:${WEB_PORT:-8443}"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, socket; socket.create_connection(('127.0.0.1', int(os.environ.get('WEB_PORT', 8443))), 3)"]
      interval: 60s
      timeout: 5s
      retries: 3

  # Optional Cloudflare Tunnel: set COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN
  # in the env. No ports are opened on your router; see https://github.com/zle3/nyerk/wiki/Public-access
  cloudflared:
    # Pinned release; set CLOUDFLARED_VERSION in the env to move to a newer one.
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.10.0}
    container_name: nyerk-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nyerk

# A fixed address range for this stack, so a firewall rule can stop the
# containers from reaching other devices on your LAN (https://github.com/zle3/nyerk/wiki/Public-access).
networks:
  default:
    ipam:
      config:
        - subnet: ${NYERK_SUBNET:-172.30.70.0/24}
